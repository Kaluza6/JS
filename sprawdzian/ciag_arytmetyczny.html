<body>
    <fieldset>
        <legend>Suma n początkowych wyrazów ciągu arytmetycznego</legend>
        <p><label for="a1">Podaj pierwszy wyraz ciągu: a<sub>1</sub> = </label><input type="number" name="a1" id="a1">(a<sub>1</sub> R)</p>
        <p><label for="a2">Podaj drugi wyraz ciągu: a<sub>2</sub> = </label><input type="number" name="a2" id="a2">(a<sub>2</sub> R)</p>
        <p><label for="ilewyrazow">Dla ilu wyrazów ciągu obliczyć sumę: n = </label><input type="number" name="ilewyrazow" id="ilewyrazow">(n N, n 1)</p>
        <button id="przycisk">Dla danego n wypisz max. 3 początkowe i 3 końcowe wyrazy ciągu oraz oblicz jego sumę</button>
        <div id="wynik"></div>
        <p id="suma"></p>
    </fieldset>
